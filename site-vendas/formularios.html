<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários html</title>
</head>
<body>
    <main>
        <section id="home">
            <h2>Cadastro</h2>
        </section>
        <section>
            <form id="registerForm" method="POST">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required />
                <br>

                <label for="cpf">CPF:</label>
                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                    placeholder="000.000.000-00"
                    title="Formato esperado: 000.000.000-00"
                    required
                />
                <br>

                <label for="email">e-mail:</label>
                <input type="email" id="email" name="email" required />
                <br>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required />
                <br>

                <input type="submit" value="Cadastrar" />
                <br>

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="4" cols="30"></textarea>
                <br>

                <label for="evento">Escolha o evento:</label>
                <select id="evento" name="evento">
                    <option value="rock">Show de Rock</option>
                    <option value="teatro">Teatro: A Comédia da Vida</option>
                </select>
                <br>

                <label for="termos">
                    <input type="checkbox" id="termos" name="termos" required />
                    Aceito os termos de uso
                </label>
                <br>

                <p>Forma de pagamento:</p>
                <label><input type="radio" name="pagamento" value="pix" checked /> Pix</label>
                <label><input type="radio" name="pagamento" value="cartao" /> Cartão</label>
                <br>



            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 IngressosFácil</p>
    </footer>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function (event) {
            event.preventDefault();

            const nome = document.getElementById('nome').value;
            const cpf = document.getElementById('cpf').value;
            const email = document.getElementById('email').value;

            alert(`Cadastro recebido!\nNome: ${nome}\nCPF: ${cpf}\nE-mail: ${email}`);
        });
    </script>
    
</body>
</html>
